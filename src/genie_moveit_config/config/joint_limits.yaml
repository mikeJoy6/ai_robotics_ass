# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.  # Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
joint_limits:
  Joint1_l:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  Joint1_r:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  # ── Joint2 位置收窄成 ±100°（三处之一，另两处：A2D.urdf 的 <limit>、arm_constraints.json 的 fixed）──
  #   规避策略，不是因为那里有硬限位——实测 120° 可能没事、106° 呆 5 秒也可能断电，没有规律。
  #   本处覆盖的是【MoveIt 规划器读到的 joint bounds】：URDF 里的值会被这里的 min/max_position 覆盖，
  #   所以两处都得写成一样，只改一处会被另一处盖掉。单位是【弧度】(URDF 同单位)，不是度。
  Joint2_l:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
    has_position_limits: true
    min_position: -1.7453      # -100°（收窄，原 URDF -2.09 = -119.75°）
    max_position: 2.09         # +119.75°（不动）
  Joint2_r:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
    has_position_limits: true
    min_position: -2.09        # -119.75°（不动）
    max_position: 1.7453       # +100°（收窄，原 URDF 2.09 = +119.75°）
  Joint3_l:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  Joint3_r:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  Joint4_l:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  Joint4_r:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  Joint5_l:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  Joint5_r:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  Joint6_l:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  Joint6_r:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  Joint7_l:
    has_velocity_limits: true
    max_velocity: 5.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  Joint7_r:
    has_velocity_limits: true
